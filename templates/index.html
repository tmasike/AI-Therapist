<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Therapist Chat</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        body {
            background-color: #ece5dd;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .chat-container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #fff;
            border-radius: 20px;
            border: 1px solid #ddd;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        .avatar {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
        }
        .avatar img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #4CAF50;
        }
        .chat-box {
            height: 400px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 10px;
            background-color: #f5f5f5;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 15px;
            max-width: 80%;
            clear: both;
        }
        .user-msg {
            background-color: #daf8cb;
            text-align: right;
            margin-left: auto;
            border-top-right-radius: 0;
        }
        .bot-msg {
            background-color: #ffffff;
            text-align: left;
            margin-right: auto;
            border-top-left-radius: 0;
        }
        .input-group {
            margin-top: 20px;
        }
        /* Loading Spinner Styling */
        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container imessage-style">
        <div class="avatar">
            <img src="{{ url_for('static', filename='faceless_avatar.png') }}" alt="Therapist Avatar">
        </div>
        <h4 class="text-center">AI Therapist Chat</h4>
        <div class="chat-box" id="chat-box">
            <!-- Chat messages will appear here -->
        </div>
        <form id="chat-form">
            <div class="input-group">
                <input type="text" class="form-control" id="message" placeholder="Type your message..." autocomplete="off">
                <div class="input-group-append">
                    <button class="btn btn-primary" type="submit">Send</button>
                </div>
            </div>
        </form>
        <!-- Loading Spinner -->
        <div class="loading-spinner" id="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
            <p>Therapist is thinking...</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        let context = "";

        $("#chat-form").submit(function(e) {
            e.preventDefault();
            let message = $("#message").val().trim();
            if (message === "") return;

            // Display user message
            $("#chat-box").append(`<div class="message user-msg"><strong>You:</strong> ${message}</div>`);
            $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
            $("#message").val("");

            // Show loading spinner
            $("#loading-spinner").show();

            $.ajax({
                type: "POST",
                url: "/api/chat",
                contentType: "application/json",
                data: JSON.stringify({ message: message, context: context }),
                success: function(response) {
                    // Hide loading spinner
                    $("#loading-spinner").hide();

                    if(response.end_session){
                        $("#chat-box").append(`<div class="message bot-msg"><strong>Therapist:</strong> ${response.response}</div>`);
                        $("#chat-box").append(`<div class="message bot-msg"><em>Session has ended.</em></div>`);
                        $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                        return;
                    }

                    // Update context
                    context += `User: ${message}\nBot: ${response.response}\n`;

                    // Display bot message
                    $("#chat-box").append(`<div class="message bot-msg"><strong>Therapist:</strong> ${response.response}</div>`);
                    $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                },
                error: function() {
                    // Hide loading spinner
                    $("#loading-spinner").hide();
                    $("#chat-box").append(`<div class="message bot-msg"><strong>Therapist:</strong> Oops! Something went wrong. Please try again.</div>`);
                }
            });
        });
    </script>
</body>
</html>
